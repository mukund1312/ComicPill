plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mukund.comicarchive'
version = '1.0.0'

android {
  namespace "expo.modules.comicarchive"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles "consumer-rules.pro"
  }
}

dependencies {
  // RAR4 reader (pure Java). RAR5 is not supported by junrar; the module reports that clearly.
  implementation "com.github.junrar:junrar:7.5.5"
  // 7z reader and its LZMA dependency.
  implementation "org.apache.commons:commons-compress:1.27.1"
  implementation "org.tukaani:xz:1.10"
  // On-device text recognition (bundled model, no network, no Google Play services needed) for the Mind Space privacy gate.
  implementation "com.google.mlkit:text-recognition:16.0.1"
  // Speech-balloon detector (an 11 MB RT-DETR model, Apache-2.0, from ogkalu/comic-text-and-bubble-detector) run on the phone.
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
}
